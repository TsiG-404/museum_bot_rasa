version: "3.1"

nlu:
#Αρχικό καλοσορισμα απο τον χρηστη για να ξεκινησει να μιλαει το bot #
- intent: greet
  examples: |
    - Hi
    - Γειά
    - hi
    - γεια

#Πρόγραμμα Ξενάγησης#
- intent: ask_tour_schedule
  examples: |
    - ποιες ξεναγήσεις είναι διαθέσιμες σήμερα;
    - πες μου το πρόγραμμα ξεναγήσεων
    - τι διαδρομές μπορώ να κάνω;
    - θέλω να δω τις θεματικές ξεναγήσεις
    - ποιες ομάδες (groups) ξεκινούν τώρα;

#για να παρουμε την λιστα των δυναμικων περιεχομενων η απαντηση ερχεται απο την python με την λιστα#
- intent: ask_available_exhibits
  examples: |
    - ποια εκθέματα υπάρχουν;
    - τι μπορώ να δω;
    - θέλω πληροφορίες για τα εκθέματα
    - θέλω πληροφορίες για τα εκθεματα
    - τι επιλογές εκθεμάτων έχω;
    - ποια είναι η συλλογή σας;
    - πες μου τι εκθέματα έχει το μουσείο


#Πληροφορίες Εκθέματος#
- intent: ask_exhibit_info
#με αυτον τον τροπο μπορουμε να παρουμε την εκπαιδευση πανω στις προτασεις με αντικατασταση στην λεξη κλειδι exhibit για αναζητηση εργων στην βαση#
  examples: |
    - πες μου την ιστορία πίσω από τον [Παρθενώνα](exhibit_name)
    - ποιος έφτιαξε την [Αφροδίτη της Μήλου](exhibit_name);
    - δώσε μου πληροφορίες για το [δισκοβόλο](exhibit_name)
    - τι γνωρίζεις για τον [Ελ Γκρέκο](exhibit_name);
    - θέλω να μάθω περισσότερα για τον [μηχανισμό των Αντικυθήρων](exhibit_name)

#Ζήτηση Ανεκδότου#
- intent: ask_joke_anecdote
  examples: |
    - πες μου ένα αστείο
    - ξέρεις κανένα ιστορικό ανέκδοτο;
    - πες μου ένα fun fact για το μουσείο
    - κάνε με να γελάσω
    - έχεις καθόλου χιούμορ;

#Αγορά Εισιτηρίου#
- intent: buy_tickets
  examples: |
    - θέλω να αγοράσω εισιτήριο
    - πώς βγάζω εισιτήρια;
    - θέλω δύο κανονικά εισιτήρια για αύριο
    - από πού κλείνω θέση;
    - θέλω να κάνω κράτηση
    - θέλω πληροφορίες για τα εισιτήρια
    - θελω πληροφοριες για τα εισητιρια
    - θέλω να μάθω για τα εισιτήρια

#Ώρες Λειτουργίας#
- intent: ask_hours
  examples: |
    - τι ώρα κλείνει το μουσείο σήμερα;
    - ποιες είναι οι ώρες λειτουργίας;
    - πότε ανοίγετε;
    - είστε ανοιχτά την Κυριακή;
    - τι ώρες δουλεύει το μουσείο?

#Λήξη Ξενάγησης#
- intent: end_tour
  examples: |
    - Τελείωσα
    - Αυτό ήταν
    - φεύγω
    - ολοκλήρωσα την ξενάγηση
    - αντίο


#Πλοήγηση & Εύρεση Τοποθεσίας#
- intent: ask_location
  examples: |
    - Πού βρίσκεται η πτέρυγα της Σύγχρονης Τέχνης;
    - Πού έχει τουαλέτες;
    - πώς μπορώ να πάω στην αίθουσα των αρχαιοτήτων;
    - ψάχνω την έξοδο
    - πού είναι τα εκθέματα της κλασικής περιόδου;

#Κανόνες Μουσείου#
- intent: ask_museum_rules
  examples: |
    - Επιτρέπεται να βγάλω φωτογραφίες με φλας;
    - Μπορώ να έχω μαζί μου νερό;
    - επιτρέπονται τα κατοικίδια στον χώρο;
    - μπορώ να ακουμπήσω τα αγάλματα;
    - ποιοι είναι οι κανόνες του μουσείου;

#Προσβασιμότητα#
- intent: ask_accessibility
  examples: |
    - Υπάρχει ράμπα για αμαξίδια;
    - Διαθέτετε ηχητική ξενάγηση;
    - υπάρχει ασανσέρ για τους πάνω ορόφους;
    - το μουσείο είναι προσβάσιμο σε ΑΜΕΑ;
    - παρέχετε αμαξίδια για τους επισκέπτες;

#Παροχές & Εγκαταστάσεις#
- intent: ask_facilities
  examples: |
    - Πού μπορώ να αφήσω το μπουφάν μου;
    - έχει καφετέρια το μουσείο;
    - υπάρχει πωλητήριο αναμνηστικών;
    - πού είναι το βεστιάριο;
    - πού μπορώ να αγοράσω δώρα;

#Εκπτωτική Πολιτική#
- intent: ask_discounts
  examples: |
    - Υπάρχει φοιτητικό εισιτήριο;
    - Είναι δωρεάν για ανέργους;
    - έχετε εκπτώσεις για πολύτεκνους;
    - ποια είναι η τιμολογιακή σας πολιτική;
    - ποιοι δικαιούνται μειωμένο εισιτήριο;