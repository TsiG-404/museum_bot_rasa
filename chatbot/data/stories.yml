      - intent: greet
      - action: utter_greet
      - intent: ask_museum_rules
      - action: utter_ask_museum_rules
      - intent: end_tour
      - action: utter_end_tour

  - story: Ερώτηση για ώρες, εκπτώσεις και ανέκδοτο
