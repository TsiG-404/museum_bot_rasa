      - intent: ask_hours
      - action: utter_hours
      - intent: ask_discounts
      - action: utter_ask_discounts
      - intent: ask_joke_anecdote
      - action: utter_joke_anecdote
      - intent: thank_you
      - action: utter_proactive_help

  - story: Προετοιμασία επίσκεψης με προσβασιμότητα και παροχές
