version: "3.1"

stories:
  - story: Μια τυπική επίσκεψη στο μουσείο
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_tour_schedule
      - action: utter_tour_schedule
      - intent: buy_tickets
      - action: utter_buy_tickets
      - intent: end_tour
      - action: utter_end_tour

  - story: Ερώτηση για έκθεμα και ανέκδοτο
    steps:
      - intent: ask_exhibit_info 
      - action: action_provide_exhibit_info
      - intent: ask_joke_anecdote
      - action: utter_joke_anecdote

  - story: Αναζήτηση συγκεκριμένου εκθέματος
    steps:
      - intent: ask_exhibit_info
        entities:
          - exhibit_name: "δισκοβόλο"
      - slot_was_set:
          - exhibit_name: "δισκοβόλο"
      - action: action_provide_exhibit_info

  - story: Ολοκληρωμένη περιήγηση και ανέκδοτο
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_available_exhibits
      - action: action_list_available_exhibits
      - intent: ask_exhibit_info
        entities:
          - exhibit_name: "Νίκη της Σαμοθράκης"
      - action: action_provide_exhibit_info
      - intent: thank_you
      - action: utter_proactive_help
      - intent: ask_joke_anecdote
      - action: utter_joke_anecdote

  - story: Κράτηση εισιτηρίων μέσω φόρμας και μετά λίστα εκθεμάτων
    steps:
      - intent: buy_tickets
      - action: utter_buy_tickets
      - intent: buy_tickets_together
      - action: ticket_form
      - active_loop: ticket_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: utter_submit_ticket_form
      - intent: thank_you
      - action: utter_proactive_help
      - intent: ask_available_exhibits
      - action: action_list_available_exhibits

  - story: Απευθείας ερώτηση για έκθεμα και αστείο
    steps:
      - intent: ask_exhibit_info
        entities:
          - exhibit_name: "μηχανισμό των αντικυθήρων"
      - action: action_provide_exhibit_info
      - intent: ask_joke_anecdote
      - action: utter_joke_anecdote

  - story: Γρήγορη αγορά εισιτηρίων (από το link) και κλείσιμο
    steps:
      - intent: buy_tickets
      - action: utter_buy_tickets
      - intent: thank_you
      - action: utter_proactive_help

  - story: Απλή έναρξη, κανόνες και έξοδος
