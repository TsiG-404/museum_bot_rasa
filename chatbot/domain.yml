version: "3.1"

#τα βασικα στατικα intents#
intents:
  - greet
  - ask_tour_schedule
  - ask_exhibit_info
  - ask_joke_anecdote
  - buy_tickets
  - ask_hours
  - end_tour
  - ask_location
  - ask_museum_rules
  - ask_accessibility
  - ask_facilities
  - ask_discounts
  #ζηταει ο χρηστης τα περιεχομενα δυναμικα#
  - ask_available_exhibits
  #για να κλεισει ο χρηστης δυναμικα εισητηρια μεσω form 
  - buy_tickets_together
  - thank_you

#εδω μπαινουν τα entities πιο δυναμικα αντικειμενα οπως λεξεις κλειδια για αναζητησεις κτλπ#
entities:
  - exhibit_name

#εδω ειναι οι θυρες μνημης (ονομα μεταβλητης) (ειδος) (τι τυπου ειναι και το ονομα)
slots:
  #το ονομα του εκθεματατος για αναζητηση στην βαση δεδομενων
  exhibit_name:
    type: text
    mappings:
    - type: from_entity
      entity: exhibit_name
  #ποτε θελει να κλεισει εισητηριο ο χρηστης
  ticket_date:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: ticket_form
            requested_slot: ticket_date
  #ποσα εισητηρια θελει ο χρηστης
  ticket_quantity:
    type: text
    mappings:
      - type: from_text
        conditions:
          - active_loop: ticket_form
            requested_slot: ticket_quantity

#εδω ειναι τα actions απο τα entities για το τι κανουν #
actions:
  - action_provide_exhibit_info

  #εμφανιζει την λιστα με τα εκθεματα απο το db#
  - action_list_available_exhibits

#η φορμα για να κλεισεις εισητηριο με το rasa form
forms:
  ticket_form:
    required_slots:
      - ticket_date
      - ticket_quantity

responses:
  utter_greet:
  - text: "Γεια! Είμαι ο ψηφιακός σου ξεναγός. Μπορώ να σου πω ιστορίες για τα εκθέματα, να δούμε το πρόγραμμα ή να βγάλουμε εισιτήρια."

  utter_tour_schedule:
  - text: "Σήμερα έχουμε δύο υπέροχες διαδρομές! Μπορείς να ακολουθήσεις τη «Διαδρομή της Αρχαιότητας» στις 12:00 ή τη «Σύγχρονη Τέχνη» στις 14:00. Μπορείς επίσης να ενταχθείς σε κάποιο από τα ανοιχτά groups επισκεπτών!"

  #πλεον ειναι δυναμικες οι πληροφοριες#
  #utter_exhibit_info:#
  #- text: "Αυτό το έργο έχει τεράστια ιστορική σημασία. Δημιουργήθηκε κάτω από ιδιαίτερες κοινωνικές συνθήκες και αντανακλά την πραγματικότητα της εποχής του, μακριά από τα στερεότυπα που ίσως έχουμε σήμερα στο μυαλό μας. Θέλεις να μάθεις για τον δημιουργό;"#

  utter_joke_anecdote:
  - text: "Ξέρεις γιατί οι ζωγράφοι δεν παίζουν ποτέ κρυφτό; Γιατί πάντα τους προδίδει η παλέτα τους! Εντάξει, εντάξει... ίσως είμαι καλύτερος στην ιστορία παρά στα ανέκδοτα."
  - text: "Ξέρεις ότι τα αρχαία ελληνικά αγάλματα δεν ήταν ολόλευκα όπως τα βλέπουμε σήμερα; Στην πραγματικότητα ήταν βαμμένα με πολύ έντονα, ζωηρά χρώματα! Απλά ο χρόνος τα ξεθώριασε."
  - text: "Fun fact: Στην αρχαία Αθήνα, τα νομίσματα είχαν πάνω μια κουκουβάγια (το σύμβολο της Αθηνάς). Γι' αυτό, όταν κάποιος είχε πολλά λεφτά, έλεγαν 'έχει πολλές κουκουβάγιες'!"
  - text: "Ο Μηχανισμός των Αντικυθήρων, που έχουμε στη συλλογή μας, θεωρείται ο πρώτος υπολογιστής του κόσμου. Και μάντεψε... φτιάχτηκε πριν από 2.000 χρόνια!"
  - text: "Λένε ότι ο σπουδαίος γλύπτης Φειδίας είχε κρύψει το δικό του πρόσωπο, καθώς και του Περικλή, σε μια από τις μάχες που σκάλισε στην ασπίδα του αγάλματος της Αθηνάς. Ένα αρχαίο 'easter egg' δηλαδή!"
  - text: "Όταν ο Διογένης ο Κυνικός είδε τον γιο μιας εταίρας να ρίχνει πέτρες σε ένα πλήθος, του φώναξε: 'Πρόσεχε, παιδί μου, μήπως πετύχεις τον πατέρα σου!'."
  - text: "Ο φιλόσοφος Ζήνων ο Ελεάτης, όταν ένας τύραννος τον βασάνιζε για να μαρτυρήσει τους συνωμότες, του είπε ότι έχει να του πει κάτι κρυφά στο αυτί. Μόλις ο τύραννος πλησίασε, ο Ζήνων του δάγκωσε το αυτί και δεν το άφηνε με τίποτα!"
  - text: "Κάποτε ρώτησαν τον Αρίστιππο τι κερδίζουν οι φιλόσοφοι. Αυτός απάντησε: 'Ακόμα κι αν καταργηθούν όλοι οι νόμοι, εμείς θα συνεχίσουμε να ζούμε με τον ίδιο τρόπο'."
  - text: "Όταν ο Μέγας Αλέξανδρος συνάντησε τον Διογένη και τον ρώτησε αν θέλει κάποια χάρη, ο Διογένης, που καθόταν στον ήλιο, του απάντησε απλά: 'Μου κλείνεις τον ήλιο, κάνε λίγο πιο εκεί'."
  - text: "Ο Σωκράτης έλεγε συχνά για τον γάμο: 'Οπωσδήποτε να παντρευτείς. Αν βρεις μια καλή σύζυγο, θα γίνεις ευτυχισμένος. Αν βρεις κακή, θα γίνεις φιλόσοφος'."
  - text: "Κάποτε ένας πλούσιος ζήτησε από τον Αρίστιππο να μορφώσει τον γιο του και ο φιλόσοφος ζήτησε 500 δραχμές. Ο πατέρας παραπονέθηκε: 'Με τόσα λεφτά αγοράζω ένα γαϊδούρι!'. Και ο Αρίστιππος απάντησε: 'Αγόρασέ το, και έτσι θα έχεις δύο στο σπίτι σου'."
  - text: "Ο ζωγράφος Ζεύξης πέθανε, κατά κυριολεξία, από τα γέλια! Είχε ζωγραφίσει μια ηλικιωμένη γυναίκα με έναν πολύ αστείο τρόπο και κοιτάζοντας το ίδιο του το έργο, έπαθε νευρικό κράξιμο από το γέλιο μέχρι που ξεψύχησε."
  - text: "Fun Fact: Στην αρχαία Ελλάδα, το να ρίξεις ένα μήλο σε κάποιον θεωρούταν επίσημη πρόταση γάμου! Αν το έπιανε, σήμαινε ότι δεχόταν."
  - text: "Fun Fact: Η λέξη 'γυμνάσιο' προέρχεται από τη λέξη 'γυμνός', επειδή οι αρχαίοι αθλητές γυμνάζονταν και αγωνίζονταν χωρίς καθόλου ρούχα, για να έχουν ελευθερία κινήσεων."
  - text: "Fun Fact: Οι αρχαίοι Έλληνες δεν έπιναν ποτέ το κρασί τους σκέτο. Το νέρωναν πάντα (κεκραμένος οίνος), γιατί το να πίνει κανείς ανέρωτο κρασί θεωρούταν βαρβαρότητα και συνήθεια των μεθυσμένων."
  
  utter_buy_tickets:
  - text: "Μπορείς να κλείσεις τα εισιτήριά σου γρήγορα από το [site μας](link), ή αν προτιμάς, μπορούμε να τα κλείσουμε παρέα από εδώ! Τι προτιμάς;"

  utter_hours:
  - text: "Το μουσείο μας είναι ανοιχτό καθημερινά από τις 09:00 το πρωί έως τις 20:00 το βράδυ. Τις Δευτέρες παραμένουμε κλειστά."

  utter_end_tour:
  - text: "Χάρηκα πολύ που σε είχα στην παρέα μου σήμερα! Ελπίζω να απόλαυσες την ξενάγηση. Καλό δρόμο και εις το επανιδείν!"

  utter_ask_location:
  - text: "Βεβαίως! Η πτέρυγα της Σύγχρονης Τέχνης βρίσκεται στον πρώτο όροφο. Οι τουαλέτες είναι στο ισόγειο, ακριβώς δίπλα από την κεντρική είσοδο. Αν ψάχνεις κάτι άλλο, πες μου!"

  utter_ask_museum_rules:
  - text: "Για την προστασία των εκθεμάτων, η φωτογράφιση επιτρέπεται αλλά αυστηρά χωρίς φλας. Επίσης, μπορείτε να έχετε μαζί σας μπουκαλάκι με νερό, αλλά η κατανάλωση τροφίμων επιτρέπεται μόνο στον χώρο του καφέ. Και φυσικά, παρακαλούμε μην αγγίζετε τα εκθέματα!"

  utter_ask_accessibility:
  - text: "Το μουσείο μας είναι πλήρως προσβάσιμο! Διαθέτουμε ράμπες, ευρύχωρα ασανσέρ για αμαξίδια και ειδικές τουαλέτες στο ισόγειο. Επίσης, μπορείτε να ζητήσετε συσκευές ηχητικής ξενάγησης (audio guides) από την υποδοχή."

  utter_ask_facilities:
  - text: "Στο ισόγειο θα βρείτε το βεστιάριο για να αφήσετε τα πράγματά σας με ασφάλεια. Στον ίδιο όροφο λειτουργεί το πωλητήριο αναμνηστικών, ενώ στον τελευταίο όροφο υπάρχει καφετέρια με υπέροχη θέα!"

  utter_ask_discounts:
  - text: "Φυσικά! Παρέχουμε μειωμένο εισιτήριο σε φοιτητές και άτομα άνω των 65 ετών. Η είσοδος είναι εντελώς δωρεάν για ανέργους (με επίδειξη κάρτας), ΑΜΕΑ και παιδιά κάτω των 18 ετών."

  #utter_available_exhibits:
  #- text: "Στη συλλογή μας έχουμε σπουδαία έργα! Μπορείς να με ρωτήσεις για τον Παρθενώνα, την Αφροδίτη της Μήλου, τον Δισκοβόλο ή τον Ελ Γκρέκο. Για ποιο θέλεις να μάθεις;"
  
  #τα στοιχεια ερωτησεων για το ticket rasa form 
  utter_ask_ticket_date:
  - text: "Για ποια ημερομηνία θα θέλατε να κλείσετε τα εισιτήρια;"

  utter_ask_ticket_quantity:
  - text: "Για πόσα άτομα ενδιαφέρεστε;"

  utter_submit_ticket_form:
  - text: "Τέλεια! Έγινε προ-κράτηση για {ticket_quantity} εισιτήρια για την ημερομηνία {ticket_date}. Μπορείς να ολοκληρώσεις την πληρωμή σου [εδώ](link)."
  
  #το fall back σε περιπτωση που δεν καταλαβε την ερωτηση
  utter_default:
  - text: "Συγγνώμη, δεν το κατάλαβα ακριβώς αυτό. Μήπως μπορείς να το διατυπώσεις διαφορετικά;"

  utter_proactive_help:
  - text: "Χαρά μου! Τώρα που κανονίσαμε τα εισιτήρια, μήπως είσαι έτοιμος να συναντήσεις τον φιλικό δράκο και να προσπαθήσουμε να ανοίξουμε τις μαγικές πόρτες;"
  - text: "Παρακαλώ! Αν θέλεις, μπορούμε να εξερευνήσουμε τα εκθέματα ή να δούμε πώς να οργανώσετε το δικό σας group περιήγησης. Τι λες;"
  - text: "Τίποτα! Μήπως θέλεις να σου πω μια σύντομη ιστορία για κάποιο από τα εκθέματά μας;"
  




session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true